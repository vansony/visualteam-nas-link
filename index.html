<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>비주얼팀 NAS 열기</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#202938}main{background:white;padding:32px;border:1px solid #e3e6eb;border-radius:16px;width:min(500px,calc(100% - 72px))}h1{font-size:23px}p{line-height:1.6}code{display:block;overflow-wrap:anywhere;padding:12px;background:#f5f6f8;border-radius:8px;font-size:12px}button{width:100%;padding:14px;background:#1a314f;color:white;border:0;border-radius:9px;font-size:15px;cursor:pointer;margin-top:16px}.error{color:#b42318}.muted{color:#667085;font-size:12px}</style></head>
<body><main><h1>비주얼팀 NAS 폴더 열기</h1><p id="status">폴더 링크를 확인하고 있어요.</p><code id="folder" hidden></code><button id="open" hidden>Finder에서 폴더 열기</button><p class="muted">동료 Mac에 '비주얼팀 NAS 열기' 단축어 설치가 필요해요. 실행 시 브라우저의 확인 창이 나타날 수 있어요.</p></main>
<script>(()=>{'use strict';const status=document.getElementById('status'),folder=document.getElementById('folder'),button=document.getElementById('open');try{const encoded=new URLSearchParams(location.search).get('p');if(!encoded||!/^[A-Za-z0-9_-]{1,8192}$/.test(encoded))throw Error('유효하지 않은 폴더 링크입니다.');const binary=atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-encoded.length%4)%4));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const path=new TextDecoder('utf-8',{fatal:true}).decode(bytes);const root='/Volumes/SND/Masmarulez/';if(!(path===root.slice(0,-1)||path.startsWith(root))||/[\0\r\n]/.test(path)||path.split('/').some(x=>x==='..'||x==='.'))throw Error('허용되지 않은 폴더 경로입니다.');folder.hidden=false;folder.textContent=path;status.textContent='아래 버튼을 눌러 Finder에서 폴더를 여세요.';const url='shortcuts://run-shortcut?name='+encodeURIComponent('비주얼팀 NAS 열기')+'&input=text&text='+encodeURIComponent(path);button.hidden=false;button.addEventListener('click',()=>{location.href=url;});}catch(err){status.textContent=err.message;status.className='error';}})();</script></body></html>
